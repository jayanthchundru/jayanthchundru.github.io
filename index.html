<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Jayanth Chundru</title>
		<link rel="icon" type="image/png" href="images/infinity-transparent.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap"
		/>
		<script>
			(() => {
				let storedTheme = null;
				try {
					storedTheme = localStorage.getItem("portfolio-theme");
				} catch (err) {}
				document.documentElement.dataset.theme = storedTheme || "dark";
			})();
		</script>
		<link rel="stylesheet" href="styles.css" />
		<script type="module" src="app.js"></script>
	</head>
	<body>
		<main id="app"></main>
	</body>
</html>
