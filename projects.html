<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projects</title>
    <link rel="icon" type="image/png" href="images/infinity-transparent.png?v=1" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;600;700&family=Sora:wght@300;400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="grid-bg">
    <main>
      <header class="site-header">
        <nav class="main-nav">
          <span class="nav-name">Jayanth Chundru</span>
          <div class="nav-links">
            <a href="index.html#about">About</a>
            <a href="index.html#news">News</a>
            <a href="index.html#publications">Publications</a>
            <a href="projects.html">Projects</a>
            <a href="blogs.html">Blogs</a>
          </div>
          <div class="nav-actions">
            <button
              id="theme-toggle"
              class="theme-toggle"
              type="button"
              aria-label="Toggle color theme"
            ></button>
            <button
              id="hamburger"
              class="hamburger"
              type="button"
              aria-label="Toggle navigation"
              aria-expanded="false"
            >
              <span></span>
              <span></span>
              <span></span>
            </button>
          </div>
        </nav>
      </header>

      <section id="projects" class="section reveal" style="--delay: 0.2s">
        <div class="projects-top-grid">
          <div class="skills-box">
            <div class="skills-box-title">Skills</div>
            <img
              src="https://skillicons.dev/icons?i=python,cpp,js,pytorch,sklearn,git,docker,linux,flask,azure,aws,react,nodejs&perline=7"
              alt="Skills"
              class="skills-logos"
              loading="lazy"
            />
          </div>
          <a
            id="leetcode-card-link"
            class="stats-card leetcode-card"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
          >
            <div class="skills-box-title">LeetCode</div>
            <img
              id="leetcode-card-image"
              class="leetcode-image"
              src=""
              alt="LeetCode stats"
              loading="lazy"
            />
          </a>
        </div>
        <div id="projects-list" class="grid projects-grid"></div>
        <div class="section-title section-title--spaced">Resources</div>
        <ul id="resources-list" class="resources-list"></ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
