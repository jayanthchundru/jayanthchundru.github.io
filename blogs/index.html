<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Blogs — Jayanth Chundru</title>
		<link rel="icon" type="image/svg+xml" href="../images/jc-favicon.svg" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap"
		/>
		<script>
			(() => {
				let storedTheme = null;
				try {
					storedTheme = localStorage.getItem("portfolio-theme");
				} catch (err) {}
				document.documentElement.dataset.theme = storedTheme || "light";
			})();
		</script>
		<link rel="stylesheet" href="../styles.css" />
	</head>
	<body>
		<div id="app">
			<main>
				<header>
					<h1>Blogs</h1>
					<nav class="nav-row" aria-label="Primary">
						<a href="../">Home</a>
						<span class="nav-separator" aria-hidden="true">·</span>
						<a href="../#publications">Research</a>
						<span class="nav-separator" aria-hidden="true">·</span>
						<!-- <a href="../#projects">Projects</a> -->
						<!-- <span class="nav-separator" aria-hidden="true">·</span> -->
						<a href="./" aria-current="page">Blogs</a>
						<span class="nav-separator" aria-hidden="true">·</span>
						<a href="../gallery/">Gallery</a>
						<span class="nav-separator" aria-hidden="true">·</span>
						<button class="theme-toggle" type="button" id="theme-toggle"></button>
					</nav>
				</header>
				<p class="intro-note">Coming soon.</p>
			</main>
		</div>
		<script>
			(() => {
				const themeToggle = document.getElementById("theme-toggle");
				if (!themeToggle) {
					return;
				}

				const writeStoredTheme = (theme) => {
					try {
						localStorage.setItem("portfolio-theme", theme);
					} catch (err) {}
				};

				const applyTheme = (theme) => {
					document.documentElement.dataset.theme = theme;
					writeStoredTheme(theme);
				};

				const syncToggle = () => {
					const isDark = document.documentElement.dataset.theme === "dark";
					themeToggle.innerHTML = isDark
						? `
							<svg class="theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
								<circle cx="12" cy="12" r="5.2" />
								<path d="M12 1.8v3M12 19.2v3M4.78 4.78l2.12 2.12M17.1 17.1l2.12 2.12M1.8 12h3M19.2 12h3M4.78 19.22l2.12-2.12M17.1 6.9l2.12-2.12" />
							</svg>
						`
						: `
							<svg class="theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
								<path d="M17.8 14.4A7.7 7.7 0 0 1 9.6 3.1a9.4 9.4 0 1 0 11.3 11.3 7.65 7.65 0 0 1-3.1 0z" />
							</svg>
						`;
					themeToggle.setAttribute("aria-label", isDark ? "Switch to light mode" : "Switch to dark mode");
					themeToggle.setAttribute("aria-pressed", String(isDark));
				};

				themeToggle.addEventListener("click", () => {
					const nextTheme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
					applyTheme(nextTheme);
					syncToggle();
				});

				syncToggle();
			})();
		</script>
	</body>
</html>
