<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Blogs — Jayanth Chundru</title>
		<link rel="icon" type="image/svg+xml" href="../images/jc-favicon.svg" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap"
		/>
		<link rel="stylesheet" href="../styles.css" />
		<style>
			.blog-intro {
				max-width: 38rem;
				margin-bottom: 1.8rem;
			}

			.topic-list {
				display: flex;
				flex-wrap: wrap;
				gap: 0.5rem;
				margin: 0;
				padding: 0;
				list-style: none;
			}

			.topic-list li {
				margin: 0;
			}

			.topic-list a {
				display: block;
				padding: 0.18rem 0.65rem;
				border-radius: 999px;
				background: rgba(var(--accent-rgb), 0.08);
				color: var(--accent);
				font-size: 0.84rem;
				font-weight: 600;
				text-decoration: none;
				transition:
					background-color 120ms ease,
					color 120ms ease;
			}

			.topic-list a:hover,
			.topic-list a:focus-visible,
			.topic-list a[aria-current="true"] {
				background: var(--accent);
				color: var(--paper);
			}

			.post-list {
				display: grid;
				gap: 1rem;
				margin: 0 0 30px;
			}

			.post-entry {
				display: grid;
				grid-template-columns: 10rem minmax(0, 1fr);
				gap: 1rem;
				align-items: start;
				padding: 0.8rem;
				border: 1px solid var(--rule);
				border-radius: 10px;
			}

			.post-entry:hover {
				border-color: rgba(var(--accent-rgb), 0.35);
			}

			.post-entry h2 a {
				color: var(--text);
				text-decoration: none;
			}

			.post-entry h2 a:hover {
				color: var(--accent);
			}

			.post-entry h2 {
				margin: 0 0 0.45rem;
				font-size: 1rem;
				font-weight: 600;
				line-height: 1.25;
			}

			.post-entry p {
				margin: 0;
				color: var(--text);
				font-size: 0.9rem;
				text-align: left;
			}

			.post-meta {
				display: flex;
				flex-wrap: wrap;
				gap: 0.35rem 0.55rem;
				margin: 0.85rem 0 0;
				color: var(--muted);
				font-size: 0.82rem;
			}

			.post-meta span:not(:last-child)::after {
				margin-left: 0.55rem;
				color: var(--rule);
				content: "·";
			}

			.post-tags {
				display: flex;
				flex-wrap: wrap;
				gap: 0.42rem;
				margin-top: 0.9rem;
			}

			.post-tags span {
				border-radius: 999px;
				padding: 0.17rem 0.55rem;
				background: rgba(var(--accent-rgb), 0.08);
				color: var(--accent);
				font-size: 0.78rem;
				font-weight: 600;
			}

			.post-status {
				color: var(--muted);
				font-weight: 600;
			}

			.post-cover {
				margin: 0;
			}

			.post-cover img {
				display: block;
				width: 100%;
				aspect-ratio: 1.35;
				object-fit: cover;
				border: 1px solid var(--rule);
				border-radius: 8px;
			}

			.empty-state {
				margin: 0 0 2rem;
				padding: 1rem;
				border: 1px solid var(--rule);
				border-radius: 10px;
				color: var(--muted);
				font-size: 0.95rem;
				text-align: left;
			}

			@media (max-width: 640px) {
				.post-entry {
					grid-template-columns: 1fr;
					gap: 0.75rem;
				}

				.post-cover {
					order: -1;
				}

				.post-cover img {
					aspect-ratio: 16 / 8;
				}
			}
		</style>
		<script>
			(() => {
				let storedTheme = null;
				try {
					storedTheme = localStorage.getItem("portfolio-theme");
				} catch (err) {}
				document.documentElement.dataset.theme = storedTheme || "light";
			})();
		</script>
	</head>
	<body class="blogs-page">
		<div id="app">
			<main class="blog-shell">
				<header>
					<h1>Blogs</h1>
					<nav class="nav-row" aria-label="Primary">
						<a href="../">Home</a>
						<span class="nav-separator" aria-hidden="true">·</span>
						<a href="../#publications">Research</a>
						<span class="nav-separator" aria-hidden="true">·</span>
						<a href="./" aria-current="page">Blogs</a>
						<span class="nav-separator" aria-hidden="true">·</span>
						<a href="../gallery/">Gallery</a>
						<span class="nav-separator" aria-hidden="true">·</span>
						<button class="theme-toggle" type="button" id="theme-toggle"></button>
					</nav>
				</header>
				<section class="blog-intro" aria-label="Blog topics">
					<ul class="topic-list" aria-label="Blog topics">
						<li><a href="?topic=projects">Projects</a></li>
						<li><a href="?topic=large-language-models">Large Language Models</a></li>
						<li><a href="?topic=multimodal-ai">Multimodal AI</a></li>
						<li><a href="?topic=machine-learning">Machine Learning</a></li>
					</ul>
				</section>
				<section id="posts" class="post-list" aria-label="Published articles"></section>
				<p class="empty-state" role="status">No published articles yet.</p>
			</main>
		</div>
		<script>
			(() => {
				const selectedTopic = new URLSearchParams(window.location.search).get("topic");
				if (selectedTopic) {
					const selectedLink = document.querySelector(`.topic-list a[href="?topic=${selectedTopic}"]`);
					if (selectedLink) {
						selectedLink.setAttribute("aria-current", "true");
						const posts = [...document.querySelectorAll(".post-entry")];
						const visiblePosts = posts.filter((post) => post.dataset.topics.split(" ").includes(selectedTopic));
						posts.forEach((post) => {
							post.hidden = !visiblePosts.includes(post);
						});
						const emptyState = document.querySelector(".empty-state");
						if (emptyState && visiblePosts.length === 0) {
							emptyState.hidden = false;
							emptyState.textContent = `No published articles about ${selectedLink.textContent} yet.`;
						}
					}
				}

				const themeToggle = document.getElementById("theme-toggle");
				if (!themeToggle) {
					return;
				}

				const writeStoredTheme = (theme) => {
					try {
						localStorage.setItem("portfolio-theme", theme);
					} catch (err) {}
				};

				const applyTheme = (theme) => {
					document.documentElement.dataset.theme = theme;
					writeStoredTheme(theme);
				};

				const syncToggle = () => {
					const isDark = document.documentElement.dataset.theme === "dark";
					themeToggle.innerHTML = isDark
						? `
							<svg class="theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
								<circle cx="12" cy="12" r="5.2" />
								<path d="M12 1.8v3M12 19.2v3M4.78 4.78l2.12 2.12M17.1 17.1l2.12 2.12M1.8 12h3M19.2 12h3M4.78 19.22l2.12-2.12M17.1 6.9l2.12-2.12" />
							</svg>
						`
						: `
							<svg class="theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
								<path d="M17.8 14.4A7.7 7.7 0 0 1 9.6 3.1a9.4 9.4 0 1 0 11.3 11.3 7.65 7.65 0 0 1-3.1 0z" />
							</svg>
						`;
					themeToggle.setAttribute("aria-label", isDark ? "Switch to light mode" : "Switch to dark mode");
					themeToggle.setAttribute("aria-pressed", String(isDark));
				};

				themeToggle.addEventListener("click", () => {
					const nextTheme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
					applyTheme(nextTheme);
					syncToggle();
				});

				syncToggle();
			})();
		</script>
	</body>
</html>
