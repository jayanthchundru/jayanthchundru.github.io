<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog Post</title>
    <link rel="icon" type="image/png" href="images/infinity-transparent.png?v=1" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;600;700&family=Sora:wght@300;400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header class="site-header">
        <nav class="main-nav">
          <span class="nav-name">Jayanth Chundru</span>
          <div class="nav-links">
            <a href="index.html#about">About</a>
            <a href="index.html#news">News</a>
            <a href="index.html#publications">Publications</a>
            <!-- <a href="projects.html">Projects</a> -->
            <a href="blogs.html">Blogs</a>
          </div>
          <div class="nav-actions">
            <button
              id="theme-toggle"
              class="theme-toggle"
              type="button"
              aria-label="Toggle color theme"
            ></button>
            <button
              id="hamburger"
              class="hamburger"
              type="button"
              aria-label="Toggle navigation"
              aria-expanded="false"
            >
              <span></span>
              <span></span>
              <span></span>
            </button>
          </div>
        </nav>
      </header>

      <div class="post-shell">
        <button class="toc-rail" id="toc-rail" type="button" aria-expanded="false">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <aside class="post-toc" id="post-toc-panel" aria-hidden="true">
          <div class="post-toc-title">Contents</div>
          <nav id="post-toc"></nav>
        </aside>

        <article class="post">
          <header class="post-header reveal" style="--delay: 0.1s">
            <div class="post-kicker" id="post-kicker"></div>
            <h1 class="post-title" id="post-title"></h1>
            <div class="post-author" id="post-author"></div>
            <div class="post-tags" id="post-tags"></div>
          </header>

          <div class="post-hero-image reveal" id="post-hero" style="--delay: 0.15s"></div>

          <div class="post-content reveal" id="post-content" style="--delay: 0.2s"></div>
        </article>
      </div>
    </main>
    <script src="post.js"></script>
  </body>
</html>
