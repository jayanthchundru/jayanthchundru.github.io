<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="40 20 120 120">
  <defs>
    <linearGradient id="tloopA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#AFA9EC"/>
      <stop offset="100%" stop-color="#534AB7"/>
    </linearGradient>
    <linearGradient id="tloopB" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7F77DD"/>
      <stop offset="100%" stop-color="#3C3489"/>
    </linearGradient>
  </defs>

  <!-- No background — fully transparent -->

  <!-- Outer glow ring -->
  <circle cx="100" cy="100" r="78" fill="none" stroke="#534AB7" stroke-width="0.8" opacity="0.15"/>

  <!-- Shadow/depth outer -->
  <path d="M48 100 C48 66,76 50,100 100 C124 150,152 134,152 100 C152 66,124 50,100 100 C76 150,48 134,48 100 Z"
    fill="none" stroke="#26215C" stroke-width="12" stroke-linecap="round" opacity="0.2"/>

  <!-- Main left loop -->
  <path d="M48 100 C48 66,76 50,100 100"
    fill="none" stroke="url(#tloopA)" stroke-width="6" stroke-linecap="round"/>

  <!-- Main right loop -->
  <path d="M100 100 C124 150,152 134,152 100 C152 66,124 50,100 100"
    fill="none" stroke="url(#tloopB)" stroke-width="6" stroke-linecap="round"/>

  <!-- Back half of left loop (slightly dimmer) -->
  <path d="M100 100 C76 150,48 134,48 100"
    fill="none" stroke="#534AB7" stroke-width="6" stroke-linecap="round" opacity="0.6"/>

  <!-- Highlight passes -->
  <path d="M48 100 C48 66,76 50,100 100"
    fill="none" stroke="#EEEDFE" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M152 100 C152 66,124 50,100 100"
    fill="none" stroke="#EEEDFE" stroke-width="2" stroke-linecap="round" opacity="0.2"/>

  <!-- End cap nodes -->
  <circle cx="48"  cy="100" r="6" fill="white" stroke="#534AB7" stroke-width="2"/>
  <circle cx="48"  cy="100" r="2.5" fill="#534AB7"/>
  <circle cx="152" cy="100" r="6" fill="white" stroke="#534AB7" stroke-width="2"/>
  <circle cx="152" cy="100" r="2.5" fill="#534AB7"/>

  <!-- Center crossing node -->
  <circle cx="100" cy="100" r="8"   fill="white" stroke="#534AB7" stroke-width="1.5" opacity="0.9"/>
  <circle cx="100" cy="100" r="5"   fill="#534AB7"/>
  <circle cx="97"  cy="97"  r="2"   fill="#EEEDFE" opacity="0.6"/>

  <!-- Cross-sparkle top -->
  <line x1="100" y1="16" x2="100" y2="24" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="96"  y1="20" x2="104" y2="20" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Tiny orbiting dots -->
  <circle cx="62"  cy="68"  r="2" fill="#AFA9EC" opacity="0.55"/>
  <circle cx="138" cy="132" r="2" fill="#7F77DD"  opacity="0.55"/>
  <circle cx="138" cy="68"  r="1.5" fill="#AFA9EC" opacity="0.35"/>
  <circle cx="62"  cy="132" r="1.5" fill="#7F77DD"  opacity="0.35"/>
</svg>
